<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tech Blog</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef2ff,#dbeafe,#f0f9ff);
            color:#333;
        }

        header{
            background:linear-gradient(90deg,#4f46e5,#2563eb);
            color:white;
            text-align:center;
            padding:40px 20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        header h1{
            font-size:42px;
        }

        header p{
            margin-top:10px;
            font-size:18px;
            opacity:0.9;
        }

        nav{
            background:#ffffff;
            display:flex;
            justify-content:center;
            gap:30px;
            padding:15px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        nav a{
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:40px auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .content{
            padding:20px;
        }

        .content h2{
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .content p{
            color:#555;
            line-height:1.6;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            background:#2563eb;
            color:white;
            padding:10px 20px;
            border-radius:25px;
            text-decoration:none;
            transition:0.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        footer{
            margin-top:40px;
            background:#1e293b;
            color:white;
            text-align:center;
            padding:20px;
        }
    </style>

</head>
<body>

<header>
    <h1>🌐 Welcome to Tech World </h1>
    <p>Sharing knowledge about Cloud, Docker, Kubernetes & DevOps</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Articles</a>
    <a href="#">Tutorials</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="card">
        <img src="https://picsum.photos/500/300?random=1" alt="Cloud">
        <div class="content">
            <h2>☁️ Cloud Computing</h2>
            <p>
                Learn cloud fundamentals, deployment strategies,
                and best practices for scalable applications.
            </p>
            <a href="#" class="btn">Read More</a>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/500/300?random=2" alt="Docker">
        <div class="content">
            <h2>🐳 Docker Containers</h2>
            <p>
                Build lightweight, portable applications using Docker
                and simplify software deployment.
            </p>
            <a href="#" class="btn">Read More</a>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/500/300?random=3" alt="Kubernetes">
        <div class="content">
            <h2>🚀 Kubernetes</h2>
            <p>
                Deploy, scale, and manage containerized applications
                efficiently with Kubernetes.
            </p>
            <a href="#" class="btn">Read More</a>
        </div>
    </div>

</div>

<footer>
    <p>© 2026 My Tech Blog | Designed with HTML & CSS</p>
</footer>

</body>
</html>

